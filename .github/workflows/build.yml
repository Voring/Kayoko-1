name: Build Kayoko

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        run: brew install ldid xz make

      - name: Apply LaunchServices hook patch (idempotent)
        run: |
          if grep -q "LSApplicationWorkspace, openURL, withOptions" Core/KayokoSpringBoardHooks.m; then
            echo "LaunchServices hooks already applied, skipping."
          else
            git apply --verbose patches/kayoko-ls-hooks.patch
          fi

      - name: Setup Theos (roothide)
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iOS 16.5 SDK
        run: |
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          rm -rf "$HOME/theos/sdks"
          mv /tmp/sdks "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Build roothide package
        run: |
          export THEOS="$HOME/theos"
          chmod +x ./build.sh
          ./build.sh roothide

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: kayoko-roothide-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Release deb
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kayoko roothide build ${{ github.run_number }}
          body: Automated roothide build with kayoko:// URL scheme (LaunchServices hooks) and word-selection search button.
          files: packages/*.deb
          fail_on_unmatched_files: true

      - name: Commit applied source
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: hook LaunchServices for kayoko:// interception [skip ci]" || echo "nothing"
          git push origin main || echo "push failed"
