name: Build Kayoko

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        run: brew install ldid xz make

      - name: Apply LaunchServices hook patch (idempotent)
        run: |
          if grep -q "LSApplicationWorkspace, openURL, withOptions" Core/KayokoSpringBoardHooks.m; then
            echo "LaunchServices hooks already applied, skipping."
          else
            git apply --verbose patches/kayoko-ls-hooks.patch
          fi

      - name: Setup Theos (roothide)
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iOS 16.5 SDK
        run: |
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          rm -rf "$HOME/theos/sdks"
          mv /tmp/sdks "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Build roothide package
        run: |
          export THEOS="$HOME/theos"
          chmod +x ./build.sh
          set +e
          ./build.sh roothide > /tmp/build.log 2>&1
          code=$?
          echo "BUILD_SH_EXIT=$code" >> /tmp/build.log
          cat /tmp/build.log
          exit $code

      - name: Diagnostics
        if: always()
        run: |
          pwd
          echo '--- packages ---'
          ls -l packages 2>&1 || true
          echo '--- out ---'
          ls -l out 2>&1 || true

      - name: Publish deb and build log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out
          if ls packages/*.deb >/dev/null 2>&1; then cp packages/*.deb out/latest.deb; fi
          rm -f build-log.txt
          echo "=== BUILD LOG (last 300 lines) ===" > build-log.txt
          if [ -f /tmp/build.log ]; then
            tail -n 300 /tmp/build.log | sed 's/[[:cntrl:]]//g' >> build-log.txt
          else
            echo "no log produced" >> build-log.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-log.txt out/latest.deb 2>/dev/null || git add build-log.txt || true
          git commit -m "ci: build log and deb [skip ci]" || true
          git pull --rebase || true
          git push || true

      - name: Upload deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kayoko-roothide-deb
          path: packages/*.deb
          if-no-files-found: warn

      - name: Release deb
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kayoko roothide build ${{ github.run_number }}
          body: Automated roothide build with kayoko:// URL scheme and word-selection search button.
          files: packages/*.deb
          fail_on_unmatched_files: false
