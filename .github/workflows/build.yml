name: Build Kayoko

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        run: brew install ldid xz make

      - name: Apply source changes (idempotent)
        run: |
          if [ -f Core/URLScheme/KayokoURLSchemeHandler.m ]; then
            echo "Patch already applied in repository, skipping."
          else
            curl -sSL -o /tmp/k.b64 https://raw.githubusercontent.com/Voring/Kayoko/main/patches/kayoko-changes.b64
            base64 -D -i /tmp/k.b64 -o /tmp/k.xz
            xz -d -c /tmp/k.xz > /tmp/k.patch
            git apply --exclude='.github/workflows/build.yml' --verbose /tmp/k.patch
          fi

      - name: Setup Theos (roothide)
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iOS 16.5 SDK
        run: |
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          rm -rf "$HOME/theos/sdks"
          mv /tmp/sdks "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Build roothide package
        run: |
          export THEOS="$HOME/theos"
          chmod +x ./build.sh
          ./build.sh roothide

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: kayoko-roothide-deb
          path: packages/*.deb
          if-no-files-found: error
